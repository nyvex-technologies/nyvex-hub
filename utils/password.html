<!DOCTYPE html><html lang="ru"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Пароль — Nyvex</title>
<style>body{margin:0;background:#0b1020;color:#eef;font-family:system-ui;padding:20px;text-align:center}a{color:#a78bfa}
#p{font-size:22px;word-break:break-all;background:#121a28;padding:16px;border-radius:12px;margin:16px 0}

<p><a href="/">← Hub</a></p><h1>🔐 Генератор паролей</h1>
<label>Длина <input id="n" type="number" value="16" min="4" max="64"></label>
<div id="p">—</div><button onclick="gen()">Сгенерировать</button>
<script>
function gen(){const c='abcdefghijkmnopqrstuvwxyzABCDEFGHJKLMNPQRSTUVWXYZ23456789!@#$%';let s='';const L=+n.value||16;for(let i=0;i<L;i++)s+=c[Math.random()*c.length|0];p.textContent=s}
</script></body></html>
