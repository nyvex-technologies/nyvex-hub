<!DOCTYPE html><html lang="ru"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Калькулятор — Nyvex</title>
<style>body{margin:0;background:#0b1020;color:#eef;font-family:system-ui;padding:16px;max-width:320px;margin:0 auto}a{color:#a78bfa}
#o{background:#121a28;padding:16px;border-radius:12px;text-align:right;font-size:28px;margin-bottom:8px;min-height:40px}
.g{display:grid;grid-template-columns:repeat(4,1fr);gap:6px} button{padding:16px;border:0;border-radius:10px;background:#1a2438;color:#fff;font-size:18px}
button.op{background:#8b5cf6}</style></head><body>
<p><a href="/">← Hub</a></p><h1>🧮</h1><div id="o">0</div><div class="g" id="g"></div>
<script>
let cur='0',ops=['7','8','9','/','4','5','6','*','1','2','3','-','0','.','=','+','C'];
const o=document.getElementById('o');ops.forEach(k=>{const b=document.createElement('button');b.textContent=k;if('/+*-='.includes(k))b.className='op';
b.onclick=()=>{if(k=='C')cur='0';else if(k=='='){try{cur=String(Function('"use strict";return('+cur+')')())}catch{cur='Err'}}else cur=(cur=='0'&&k!='.')?k:cur+k;o.textContent=cur};g.appendChild(b)});
</script></body></html>
