<!DOCTYPE html>
<html lang="ru"><head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Nyvex Calc</title>
<style>
body{margin:0;min-height:100vh;display:grid;place-items:center;background:#080a12;color:#fff;font:16px system-ui}
.box{width:min(320px,94vw);background:#121726;border:1px solid rgba(141,92,255,.3);border-radius:20px;padding:16px;box-shadow:0 20px 50px rgba(0,0,0,.4)}
.logo{font-weight:900;color:#c4b0ff;margin-bottom:10px;font-size:13px;letter-spacing:1px}
#display{width:100%;height:64px;background:#0b0e18;border:1px solid rgba(255,255,255,.08);border-radius:12px;color:#fff;font-size:28px;font-weight:800;text-align:right;padding:0 14px;margin-bottom:12px}
.grid{display:grid;grid-template-columns:repeat(4,1fr);gap:8px}
button{border:0;border-radius:12px;padding:16px 0;font-weight:900;font-size:18px;cursor:pointer;background:#1a2033;color:#fff}
button.op{background:rgba(141,92,255,.25);color:#c4b0ff}
button.eq{background:linear-gradient(135deg,#8d5cff,#6b3fd4)}
button.wide{grid-column:span 2}
</style></head><body>
<div class="box">
  <div class="logo">NYVEX CALC</div>
  <input id="display" readonly value="0">
  <div class="grid" id="keys"></div>
</div>
<script>
const d=document.getElementById('display');
let cur='0',prev=null,op=null,reset=false;
const keys=['C','±','%','/','7','8','9','*','4','5','6','-','1','2','3','+','0','.','='];
const ops={'/':'/','*':'*','-':'-','+':'+'};
const grid=document.getElementById('keys');
keys.forEach(k=>{
  const b=document.createElement('button');
  b.textContent=k;
  if(k==='0')b.classList.add('wide');
  if(ops[k])b.classList.add('op');
  if(k==='=')b.classList.add('eq');
  b.onclick=()=>press(k);
  grid.appendChild(b);
});
function press(k){
  if(k==='C'){cur='0';prev=null;op=null;reset=false;d.value=cur;return}
  if(k==='±'){cur=String(-(parseFloat(cur)||0));d.value=cur;return}
  if(k==='%'){cur=String((parseFloat(cur)||0)/100);d.value=cur;return}
  if(ops[k]){
    if(prev!==null&&op&&!reset)cur=String(calc(prev,op,cur));
    prev=cur;op=k;reset=true;d.value=cur;return
  }
  if(k==='='){
    if(op&&prev!==null){cur=String(calc(prev,op,cur));prev=null;op=null;reset=true;d.value=cur}
    return
  }
  if(k==='.'){if(reset){cur='0.';reset=false}else if(!cur.includes('.'))cur+='.';d.value=cur;return}
  if(reset||cur==='0'){cur=k;reset=false}else cur+=k;
  d.value=cur;
}
function calc(a,o,b){
  a=+a;b=+b;
  if(o==='+')return a+b;if(o==='-')return a-b;if(o==='*')return a*b;if(o==='/')return b===0?'Err':a/b;
  return b;
}
</script></body></html>
