<!DOCTYPE html>
<html lang="ru"><head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Nyvex Colors</title>
<style>
body{margin:0;background:#080a12;color:#fff;font:15px system-ui;min-height:100vh;display:grid;place-items:center}
.box{width:min(360px,94vw);background:#121726;border:1px solid rgba(141,92,255,.3);border-radius:18px;padding:18px;text-align:center}
#sw{height:120px;border-radius:14px;margin-bottom:12px;border:1px solid rgba(255,255,255,.1)}
input[type=color]{width:100%;height:44px;border:0;background:none;cursor:pointer}
input[type=text]{width:100%;padding:12px;margin:8px 0;border-radius:10px;border:1px solid rgba(255,255,255,.1);background:#0b0e18;color:#c4b0ff;font-weight:800;text-align:center}
button{border:0;border-radius:10px;padding:12px;width:100%;font-weight:900;cursor:pointer;background:linear-gradient(135deg,#8d5cff,#6b3fd4);color:#fff}
</style></head><body>
<div class="box">
  <h1 style="margin-top:0;color:#c4b0ff">🎨 Палитра</h1>
  <div id="sw"></div>
  <input type="color" id="c" value="#8d5cff">
  <input type="text" id="hex" value="#8D5CFF" readonly>
  <button id="copy">Копировать HEX</button>
</div>
<script>
const c=document.getElementById('c'),hex=document.getElementById('hex'),sw=document.getElementById('sw');
function upd(){sw.style.background=c.value;hex.value=c.value.toUpperCase()}
c.oninput=upd;upd();
document.getElementById('copy').onclick=async()=>{await navigator.clipboard.writeText(hex.value);alert('Скопировано: '+hex.value)};
</script></body></html>
