<!DOCTYPE html>
<html lang="ru"><head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Nyvex Timer</title>
<style>
body{margin:0;min-height:100vh;display:grid;place-items:center;background:#080a12;color:#fff;font:15px system-ui}
.box{width:min(380px,94vw);background:#121726;border:1px solid rgba(141,92,255,.3);border-radius:20px;padding:22px;text-align:center}
.logo{font-weight:900;color:#c4b0ff;font-size:13px;letter-spacing:1px;margin-bottom:8px}
#time{font-size:48px;font-weight:950;letter-spacing:2px;margin:16px 0}
.row{display:flex;gap:8px;justify-content:center;flex-wrap:wrap;margin-bottom:12px}
button{border:0;border-radius:12px;padding:12px 16px;font-weight:900;cursor:pointer;background:#1a2033;color:#fff}
button.primary{background:linear-gradient(135deg,#8d5cff,#6b3fd4)}
input{width:64px;padding:10px;border-radius:10px;border:1px solid rgba(255,255,255,.1);background:#0b0e18;color:#fff;text-align:center;font-weight:800}
label{color:#8b94a8;font-size:12px}
</style></head><body>
<div class="box">
  <div class="logo">NYVEX TIMER</div>
  <div id="time">00:00:00</div>
  <div class="row">
    <div><label>мин</label><br><input id="m" type="number" min="0" value="5"></div>
    <div><label>сек</label><br><input id="s" type="number" min="0" max="59" value="0"></div>
  </div>
  <div class="row">
    <button class="primary" id="start">Старт</button>
    <button id="pause">Пауза</button>
    <button id="reset">Сброс</button>
    <button id="sw">Секундомер</button>
  </div>
</div>
<script>
let mode='timer', left=0, tick=null, running=false, sw=0;
const el=document.getElementById('time');
function fmt(ms){
  const t=Math.max(0,Math.floor(ms/1000));
  const h=String(Math.floor(t/3600)).padStart(2,'0');
  const m=String(Math.floor((t%3600)/60)).padStart(2,'0');
  const s=String(t%60).padStart(2,'0');
  return h+':'+m+':'+s;
}
function render(){el.textContent=fmt(mode==='timer'?left:sw)}
function stop(){clearInterval(tick);tick=null;running=false}
document.getElementById('start').onclick=()=>{
  if(running)return;
  if(mode==='timer'&&left<=0){
    left=(+document.getElementById('m').value*60+(+document.getElementById('s').value||0))*1000;
  }
  running=true;
  const t0=Date.now();
  let base=mode==='timer'?left:sw;
  tick=setInterval(()=>{
    const dt=Date.now()-t0;
    if(mode==='timer'){left=base-dt;if(left<=0){left=0;stop();alert('Готово!');}}
    else sw=base+dt;
    render();
  },100);
};
document.getElementById('pause').onclick=stop;
document.getElementById('reset').onclick=()=>{stop();left=0;sw=0;render()};
document.getElementById('sw').onclick=()=>{stop();mode=mode==='timer'?'sw':'timer';this.textContent=mode==='timer'?'Секундомер':'Таймер';left=0;sw=0;render()};
render();
</script></body></html>
