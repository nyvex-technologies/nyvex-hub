<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Nyvex Notes</title>
<style>
:root{
  --bg:#080a12;--side:#0e1220;--card:#141a2a;--text:#eef1ff;--muted:#8b94a8;
  --accent:#8d5cff;--accent2:#c4b0ff;--line:rgba(255,255,255,.09);--danger:#ff6275;
}
*{box-sizing:border-box}
body{margin:0;font:14px/1.45 system-ui,sans-serif;background:var(--bg);color:var(--text);height:100vh;display:flex;flex-direction:column}
header{display:flex;align-items:center;gap:12px;padding:12px 16px;border-bottom:1px solid var(--line);background:rgba(14,18,32,.95);backdrop-filter:blur(10px)}
.logo{font-weight:950;letter-spacing:1px}
.logo span{color:var(--accent2)}
.hdr-actions{margin-left:auto;display:flex;gap:8px;flex-wrap:wrap}
button,.btn{
  border:1px solid var(--line);background:var(--card);color:var(--text);
  padding:8px 12px;border-radius:10px;font-weight:800;cursor:pointer;font-size:13px
}
button.primary{background:linear-gradient(135deg,var(--accent),#6b3fd4);border-color:transparent;color:#fff}
button.danger{color:var(--danger);border-color:rgba(255,98,117,.35)}
button:hover{filter:brightness(1.08)}
.app{flex:1;display:grid;grid-template-columns:280px 1fr;min-height:0}
@media(max-width:720px){.app{grid-template-columns:1fr}.sidebar{display:none}.sidebar.open{display:flex}}
.sidebar{background:var(--side);border-right:1px solid var(--line);display:flex;flex-direction:column;min-height:0}
.search{padding:12px;border-bottom:1px solid var(--line)}
.search input{width:100%;padding:10px 12px;border-radius:10px;border:1px solid var(--line);background:var(--card);color:var(--text);outline:none}
.search input:focus{border-color:rgba(141,92,255,.5)}
.list{flex:1;overflow:auto;padding:8px}
.item{padding:12px;border-radius:12px;cursor:pointer;border:1px solid transparent;margin-bottom:6px}
.item:hover{background:rgba(255,255,255,.04)}
.item.active{background:rgba(141,92,255,.15);border-color:rgba(141,92,255,.35)}
.item .title{font-weight:800;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.item .preview{color:var(--muted);font-size:12px;margin-top:4px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.item .date{color:var(--muted);font-size:11px;margin-top:6px}
.editor{display:flex;flex-direction:column;min-height:0;background:radial-gradient(ellipse at top,rgba(141,92,255,.08),transparent 45%)}
.editor.empty{align-items:center;justify-content:center;color:var(--muted)}
.title-input{width:100%;border:0;background:transparent;color:var(--text);font-size:22px;font-weight:900;padding:20px 20px 8px;outline:none}
.meta{padding:0 20px 8px;color:var(--muted);font-size:12px}
textarea{flex:1;width:100%;border:0;resize:none;background:transparent;color:var(--text);padding:8px 20px 20px;font:15px/1.55 system-ui,sans-serif;outline:none}
.status{padding:8px 16px;border-top:1px solid var(--line);color:var(--muted);font-size:12px;display:flex;justify-content:space-between;gap:10px}
</style>
</head>
<body>
<header>
  <div class="logo">NYVEX <span>NOTES</span></div>
  <div class="hdr-actions">
    <button type="button" id="toggleSidebar" class="mobile-only">Список</button>
    <button type="button" id="newBtn" class="primary">+ Новая</button>
    <button type="button" id="exportBtn">Экспорт</button>
    <button type="button" id="importBtn">Импорт</button>
    <button type="button" id="delBtn" class="danger">Удалить</button>
  </div>
</header>
<div class="app">
  <aside class="sidebar" id="sidebar">
    <div class="search"><input id="q" placeholder="Поиск..."></div>
    <div class="list" id="list"></div>
  </aside>
  <main class="editor empty" id="editor">
    <div id="placeholder">Выбери заметку или создай новую</div>
    <div id="editPane" style="display:none;flex:1;flex-direction:column;min-height:0;width:100%">
      <input class="title-input" id="title" placeholder="Заголовок">
      <div class="meta" id="meta"></div>
      <textarea id="body" placeholder="Текст заметки..."></textarea>
    </div>
  </main>
</div>
<div class="status"><span id="status">Готово</span><span>Хранится локально в браузере</span></div>
<input type="file" id="file" accept="application/json" hidden>
<script>
const KEY='nyvex_notes_v1';
let notes=JSON.parse(localStorage.getItem(KEY)||'[]');
let currentId=null;
let saveTimer=null;

const $ = id => document.getElementById(id);
const listEl=$('list'), qEl=$('q'), titleEl=$('title'), bodyEl=$('body'), metaEl=$('meta');
const editor=$('editor'), editPane=$('editPane'), placeholder=$('placeholder'), statusEl=$('status');

function uid(){return Date.now().toString(36)+Math.random().toString(36).slice(2,7)}
function fmt(ts){return new Date(ts).toLocaleString('ru-RU',{day:'2-digit',month:'short',hour:'2-digit',minute:'2-digit'})}
function saveAll(){localStorage.setItem(KEY,JSON.stringify(notes));statusEl.textContent='Сохранено · '+fmt(Date.now())}
function scheduleSave(){
  statusEl.textContent='Печатаешь...';
  clearTimeout(saveTimer);
  saveTimer=setTimeout(()=>{
    const n=notes.find(x=>x.id===currentId);if(!n)return;
    n.title=titleEl.value.trim()||'Без названия';
    n.body=bodyEl.value;
    n.updated=Date.now();
    saveAll();renderList();
  },250);
}

function renderList(){
  const q=qEl.value.trim().toLowerCase();
  const items=[...notes].sort((a,b)=>b.updated-a.updated).filter(n=>{
    if(!q)return true;
    return (n.title+' '+n.body).toLowerCase().includes(q);
  });
  listEl.innerHTML=items.map(n=>`
    <div class="item ${n.id===currentId?'active':''}" data-id="${n.id}">
      <div class="title">${escapeHtml(n.title||'Без названия')}</div>
      <div class="preview">${escapeHtml((n.body||'').replace(/\s+/g,' ').slice(0,80))||'Пустая заметка'}</div>
      <div class="date">${fmt(n.updated)}</div>
    </div>`).join('')||'<div style="padding:16px;color:var(--muted)">Нет заметок</div>';
  listEl.querySelectorAll('.item').forEach(el=>{
    el.onclick=()=>openNote(el.dataset.id);
  });
}

function escapeHtml(s){return s.replace(/[&<>"']/g,c=>({ '&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;' }[c]))}

function openNote(id){
  const n=notes.find(x=>x.id===id);if(!n)return;
  currentId=id;
  placeholder.style.display='none';
  editPane.style.display='flex';
  editor.classList.remove('empty');
  titleEl.value=n.title||'';
  bodyEl.value=n.body||'';
  metaEl.textContent='Обновлено: '+fmt(n.updated);
  renderList();
  if(matchMedia('(max-width:720px)').matches)$('sidebar').classList.remove('open');
}

function newNote(){
  const n={id:uid(),title:'Новая заметка',body:'',updated:Date.now(),created:Date.now()};
  notes.unshift(n);saveAll();openNote(n.id);titleEl.focus();titleEl.select();
}

function delNote(){
  if(!currentId)return;
  if(!confirm('Удалить заметку?'))return;
  notes=notes.filter(n=>n.id!==currentId);
  currentId=null;saveAll();
  editPane.style.display='none';placeholder.style.display='block';editor.classList.add('empty');
  renderList();
}

function exportNotes(){
  const blob=new Blob([JSON.stringify(notes,null,2)],{type:'application/json'});
  const a=document.createElement('a');
  a.href=URL.createObjectURL(blob);
  a.download='nyvex-notes.json';
  a.click();
  URL.revokeObjectURL(a.href);
  statusEl.textContent='Экспорт выполнен';
}

function importNotes(file){
  const reader=new FileReader();
  reader.onload=()=>{
    try{
      const data=JSON.parse(reader.result);
      if(!Array.isArray(data))throw new Error('bad');
      notes=data.map(n=>({
        id:n.id||uid(),
        title:String(n.title||'Без названия'),
        body:String(n.body||''),
        updated:+n.updated||Date.now(),
        created:+n.created||Date.now()
      }));
      saveAll();renderList();statusEl.textContent='Импорт: '+notes.length+' заметок';
    }catch{alert('Неверный файл JSON')}
  };
  reader.readAsText(file);
}

$('newBtn').onclick=newNote;
$('delBtn').onclick=delNote;
$('exportBtn').onclick=exportNotes;
$('importBtn').onclick=()=>$('file').click();
$('file').onchange=e=>{if(e.target.files[0])importNotes(e.target.files[0]);e.target.value=''};
$('q').oninput=renderList;
titleEl.oninput=scheduleSave;
bodyEl.oninput=scheduleSave;
$('toggleSidebar').onclick=()=>$('sidebar').classList.toggle('open');

if(!notes.length){
  notes=[{id:uid(),title:'Добро пожаловать',body:'Это Nyvex Notes.\n\n• Заметки хранятся в этом браузере\n• Есть поиск, экспорт и импорт JSON\n• Нажми «+ Новая», чтобы создать заметку',updated:Date.now(),created:Date.now()}];
  saveAll();
}
renderList();
openNote(notes[0].id);
</script>
</body>
</html>
