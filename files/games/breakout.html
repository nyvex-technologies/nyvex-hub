<!DOCTYPE html>
<html lang="ru"><head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Breakout</title>
<style>
body{margin:0;background:#080a12;color:#fff;font:14px system-ui;min-height:100vh;display:grid;place-items:center}
canvas{background:#0e1220;border-radius:12px;border:1px solid rgba(141,92,255,.3);max-width:96vw}
.bar{margin:10px;display:flex;gap:10px;justify-content:center;flex-wrap:wrap}
button{border:0;border-radius:10px;padding:10px 16px;font-weight:900;cursor:pointer;background:linear-gradient(135deg,#8d5cff,#6b3fd4);color:#fff}
#sc{font-weight:900;color:#c4b0ff}
</style></head><body>
<canvas id="c" width="480" height="320"></canvas>
<div class="bar"><span id="sc">Очки: 0</span><button id="go">Старт</button></div>
<script>
const canvas=document.getElementById('c'),ctx=canvas.getContext('2d');
let paddle,ball,bricks,score,lives,run;
function start(){
  paddle={x:200,w:80,h:10};ball={x:240,y:280,vx:3,vy:-3,r:6};
  bricks=[];score=0;lives=3;run=true;
  for(let r=0;r<5;r++)for(let c=0;c<8;c++)bricks.push({x:c*58+12,y:r*22+30,w:52,h:14,alive:true,color:`hsl(${260+r*20},70%,55%)`});
  document.getElementById('sc').textContent='Очки: 0';
}
function loop(){
  ctx.fillStyle='#0e1220';ctx.fillRect(0,0,480,320);
  if(run){
    ball.x+=ball.vx;ball.y+=ball.vy;
    if(ball.x<6||ball.x>474)ball.vx*=-1;
    if(ball.y<6)ball.vy*=-1;
    if(ball.y>320){lives--;if(lives<=0)run=false;else{ball.x=240;ball.y=280;ball.vy=-3}}
    if(ball.y>300&&ball.x>paddle.x&&ball.x<paddle.x+paddle.w){ball.vy=-Math.abs(ball.vy);ball.vx+=(ball.x-(paddle.x+paddle.w/2))/20}
    bricks.forEach(b=>{
      if(!b.alive)return;
      if(ball.x>b.x&&ball.x<b.x+b.w&&ball.y>b.y&&ball.y<b.y+b.h){b.alive=false;ball.vy*=-1;score+=10;document.getElementById('sc').textContent='Очки: '+score}
    });
    if(bricks.every(b=>!b.alive))run=false;
  }
  ctx.fillStyle='#c4b0ff';ctx.fillRect(paddle.x,305,paddle.w,paddle.h);
  ctx.beginPath();ctx.arc(ball.x,ball.y,ball.r,0,Math.PI*2);ctx.fillStyle='#8d5cff';ctx.fill();
  bricks.forEach(b=>{if(b.alive){ctx.fillStyle=b.color;ctx.fillRect(b.x,b.y,b.w,b.h)}});
  requestAnimationFrame(loop);
}
canvas.addEventListener('mousemove',e=>{const r=canvas.getBoundingClientRect();paddle.x=Math.max(0,Math.min(400,(e.clientX-r.left)*(480/r.width)-paddle.w/2))});
canvas.addEventListener('touchmove',e=>{e.preventDefault();const r=canvas.getBoundingClientRect();paddle.x=Math.max(0,Math.min(400,(e.touches[0].clientX-r.left)*(480/r.width)-paddle.w/2))},{passive:false});
document.getElementById('go').onclick=start;start();loop();
</script></body></html>
