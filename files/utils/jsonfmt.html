<!DOCTYPE html>
<html lang="ru"><head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>JSON Format</title>
<style>
body{margin:0;background:#080a12;color:#fff;font:14px system-ui;min-height:100vh;display:grid;place-items:center}
.box{width:min(560px,94vw);background:#121726;border:1px solid rgba(141,92,255,.3);border-radius:18px;padding:18px}
textarea{width:100%;height:180px;border-radius:12px;border:1px solid rgba(255,255,255,.1);background:#0b0e18;color:#c4b0ff;padding:12px;font:13px/1.4 ui-monospace,monospace}
button{border:0;border-radius:10px;padding:10px 14px;margin:8px 6px 0 0;font-weight:900;cursor:pointer;background:linear-gradient(135deg,#8d5cff,#6b3fd4);color:#fff}
#err{color:#ff6275;margin-top:8px;min-height:20px}
</style></head><body>
<div class="box">
  <h1 style="margin-top:0;font-size:18px;color:#c4b0ff">🧩 JSON Format</h1>
  <textarea id="t" placeholder='{"a":1}'></textarea>
  <button id="fmt">Форматировать</button>
  <button id="min">Сжать</button>
  <div id="err"></div>
</div>
<script>
const t=document.getElementById('t'),err=document.getElementById('err');
function parse(){try{err.textContent='';return JSON.parse(t.value)}catch(e){err.textContent=e.message;return null}}
document.getElementById('fmt').onclick=()=>{const o=parse();if(o)t.value=JSON.stringify(o,null,2)};
document.getElementById('min').onclick=()=>{const o=parse();if(o)t.value=JSON.stringify(o)};
</script></body></html>
