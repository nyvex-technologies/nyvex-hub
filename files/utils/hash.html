<!DOCTYPE html>
<html lang="ru"><head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Hash</title>
<style>
body{margin:0;min-height:100vh;display:grid;place-items:center;background:#080a12;color:#fff;font:14px system-ui}
.box{width:min(520px,94vw);background:#121726;border:1px solid rgba(141,92,255,.3);border-radius:18px;padding:20px}
h1{margin:0 0 12px;font-size:18px;color:#c4b0ff}
textarea{width:100%;height:100px;border-radius:12px;border:1px solid rgba(255,255,255,.1);background:#0b0e18;color:#fff;padding:12px;font:13px ui-monospace,monospace}
button{margin-top:10px;border:0;border-radius:12px;padding:12px 16px;font-weight:900;cursor:pointer;background:linear-gradient(135deg,#8d5cff,#6b3fd4);color:#fff}
#out{margin-top:12px;word-break:break-all;font:12px ui-monospace,monospace;color:#c4b0ff;background:#0b0e18;padding:12px;border-radius:10px;min-height:40px}
</style></head><body>
<div class="box">
  <h1>#️⃣ SHA-256</h1>
  <textarea id="t" placeholder="Текст..."></textarea>
  <button id="go">Посчитать</button>
  <button id="copy" style="background:#1a2033">Копировать</button>
  <div id="out">—</div>
</div>
<script>
async function sha256(str){
  const buf=await crypto.subtle.digest('SHA-256',new TextEncoder().encode(str));
  return [...new Uint8Array(buf)].map(b=>b.toString(16).padStart(2,'0')).join('');
}
document.getElementById('go').onclick=async()=>{
  document.getElementById('out').textContent=await sha256(document.getElementById('t').value);
};
document.getElementById('copy').onclick=()=>navigator.clipboard.writeText(document.getElementById('out').textContent);
</script></body></html>
