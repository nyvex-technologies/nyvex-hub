<!DOCTYPE html><html lang="ru"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Пароли</title><style>body{margin:0;background:#0b1020;color:#eef;font-family:system-ui;padding:16px}
button{width:100%;padding:14px;border:0;border-radius:12px;background:#8b5cf6;color:#fff;font-weight:800;font-size:16px}
#p{margin-top:16px;padding:14px;border-radius:12px;background:#1a2233;word-break:break-all;font-size:18px}a{color:#c4b5fd}</style></head><body>
<a href="/">← Hub</a><h2>🔑 Пароли</h2>
<label>Длина <input id="n" type="number" value="16" min="6" max="64" style="font-size:16px;padding:8px;width:80px"></label>
<button style="margin-top:12px" onclick="const c='abcdefghijkmnopqrstuvwxyzABCDEFGHJKLMNPQRSTUVWXYZ23456789!@#$%';const L=+n.value||16;const a=new Uint8Array(L);crypto.getRandomValues(a);p.textContent=[...a].map(x=>c[x%c.length]).join('')">Сгенерировать</button>
<div id="p"></div></body></html>
