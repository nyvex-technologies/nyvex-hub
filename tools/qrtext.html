<!DOCTYPE html><html lang="ru"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>QR text</title><style>body{margin:0;background:#0b1020;color:#eef;font-family:system-ui;padding:16px}
textarea{width:100%;min-height:100px;font-size:16px;padding:12px;border-radius:12px;background:#1a2233;color:#fff;border:1px solid #333}
a{color:#c4b5fd}</style></head><body>
<a href="/">← Hub</a><h2>▦ Текст для QR</h2>
<p style="color:#8b97b0">Введи текст/ссылку и скопируй — вставь в любой QR-генератор.</p>
<textarea id="t" placeholder="https://..."></textarea>
<button style="margin-top:8px;width:100%;padding:12px;border:0;border-radius:12px;background:#8b5cf6;color:#fff;font-weight:800"
onclick="navigator.clipboard.writeText(t.value);alert('Скопировано')">Копировать</button>
</body></html>
