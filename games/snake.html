<!DOCTYPE html><html lang="ru"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,user-scalable=no">
<title>Змейка — Nyvex</title>
<style>body{margin:0;background:#0b1020;color:#eef;font-family:system-ui;text-align:center;padding:8px}a{color:#a78bfa}
canvas{background:#121a28;border-radius:12px;max-width:100%;touch-action:none} .c{display:flex;justify-content:center;gap:8px;margin:8px;flex-wrap:wrap}
button{padding:12px 16px;border:0;border-radius:10px;background:#8b5cf6;color:#fff;font-size:16px}</style></head><body>
<p><a href="/">← Hub</a></p><h1>🐍 Змейка</h1><p id="sc">Счёт: 0</p>
<canvas id="c" width="320" height="320"></canvas>
<div class="c"><button onclick="dir=3">←</button><button onclick="dir=0">↑</button><button onclick="dir=1">↓</button><button onclick="dir=2">→</button></div>
<script>
const cv=document.getElementById('c'),x=cv.getContext('2d'),N=16,S=20;
let snake=[{x:8,y:8}],dir=2,food={},score=0,tick;
function place(){do{food={x:Math.random()*N|0,y:Math.random()*N|0}}while(snake.some(s=>s.x==food.x&&s.y==food.y))}
function draw(){x.fillStyle='#121a28';x.fillRect(0,0,320,320);x.fillStyle='#8b5cf6';snake.forEach(s=>x.fillRect(s.x*S+1,s.y*S+1,S-2,S-2));x.fillStyle='#34d399';x.fillRect(food.x*S+1,food.y*S+1,S-2,S-2)}
function step(){const h={...snake[0]};if(dir==0)h.y--;if(dir==1)h.y++;if(dir==2)h.x++;if(dir==3)h.x--;
  if(h.x<0||h.y<0||h.x>=N||h.y>=N||snake.some(s=>s.x==h.x&&s.y==h.y)){clearInterval(tick);alert('Game over: '+score);return}
  snake.unshift(h);if(h.x==food.x&&h.y==food.y){score++;document.getElementById('sc').textContent='Счёт: '+score;place()}else snake.pop();draw()}
document.onkeydown=e=>{const k=e.key;if(k=='ArrowUp'&&dir!=1)dir=0;if(k=='ArrowDown'&&dir!=0)dir=1;if(k=='ArrowRight'&&dir!=3)dir=2;if(k=='ArrowLeft'&&dir!=2)dir=3};
place();draw();tick=setInterval(step,120);
</script></body></html>
