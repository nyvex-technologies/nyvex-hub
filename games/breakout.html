<!DOCTYPE html><html lang="ru"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,user-scalable=no">
<title>Арканоид</title><style>body{margin:0;background:#0b1020;color:#fff;text-align:center;font-family:system-ui}
canvas{background:#111;max-width:100%;border-radius:12px}a{color:#c4b5fd}</style></head><body>
<a href="/">← Hub</a><canvas id="c" width="360" height="480"></canvas>
<script>
const c=document.getElementById('c'),x=c.getContext('2d');
let px=150,bx=180,by=300,vx=2.5,vy=-2.5;
const bricks=[...Array(40)].map((_,i)=>({x:(i%8)*45,y:40+((i/8)|0)*22,h:1}));
c.onpointermove=e=>{const r=c.getBoundingClientRect();px=(e.clientX-r.left)/r.width*360-30};
function loop(){
  bx+=vx;by+=vy; if(bx<0||bx>360)vx*=-1; if(by<0)vy*=-1;
  if(by>450&&bx>px&&bx<px+60){vy=-Math.abs(vy);by=450}
  if(by>480){bx=180;by=300;vy=-2.5}
  bricks.forEach(b=>{if(!b.h)return;if(bx>b.x&&bx<b.x+44&&by>b.y&&by<b.y+20){b.h=0;vy*=-1}});
  x.fillStyle='#111';x.fillRect(0,0,360,480);
  x.fillStyle='#8b5cf6';bricks.forEach(b=>{if(b.h)x.fillRect(b.x,b.y,42,18)});
  x.fillStyle='#22d3ee';x.fillRect(px,455,60,10);x.beginPath();x.arc(bx,by,7,0,6.28);x.fill();
  requestAnimationFrame(loop);
}
loop();
</script></body></html>
