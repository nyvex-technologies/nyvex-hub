<!DOCTYPE html><html lang="ru"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>2048 — Nyvex</title>
<style>body{margin:0;background:#0b1020;color:#eef;font-family:system-ui;text-align:center;padding:12px}a{color:#a78bfa}
#b{display:inline-grid;grid-template-columns:repeat(4,64px);gap:6px;background:#1a2233;padding:6px;border-radius:12px}
.t{width:64px;height:64px;background:#243049;border-radius:8px;display:flex;align-items:center;justify-content:center;font-weight:800;font-size:20px}
</style></head><body>
<p><a href="/">← Hub</a></p><h1>2048</h1><p id="s">0</p><div id="b"></div>
<p>Стрелки / WASD / свайп</p>
<script>
let g=Array(16).fill(0),score=0;
const el=document.getElementById('b');
function add(){const e=g.map((v,i)=>v?null:i).filter(v=>v!=null);if(!e.length)return;g[e[Math.random()*e.length|0]]=Math.random()<.9?2:4}
function draw(){el.innerHTML='';g.forEach(v=>{const d=document.createElement('div');d.className='t';d.textContent=v||'';if(v)d.style.background=`hsl(${200+Math.log2(v)*12},60%,35%)`;el.appendChild(d)});document.getElementById('s').textContent=score}
function line(a){let x=a.filter(Boolean);for(let i=0;i<x.length-1;i++)if(x[i]==x[i+1]){x[i]*=2;score+=x[i];x[i+1]=0}x=x.filter(Boolean);while(x.length<4)x.push(0);return x}
function move(dir){let n=[...g],ch=false;const get=(r,c)=>g[r*4+c];
  if(dir=='l'||dir=='r')for(let r=0;r<4;r++){let row=[0,1,2,3].map(c=>get(r,c));if(dir=='r')row.reverse();row=line(row);if(dir=='r')row.reverse();row.forEach((v,c)=>{if(g[r*4+c]!=v)ch=true;g[r*4+c]=v})}
  else for(let c=0;c<4;c++){let col=[0,1,2,3].map(r=>get(r,c));if(dir=='d')col.reverse();col=line(col);if(dir=='d')col.reverse();col.forEach((v,r)=>{if(g[r*4+c]!=v)ch=true;g[r*4+c]=v})}
  if(ch){add();draw()}}
document.onkeydown=e=>{const m={ArrowLeft:'l',ArrowRight:'r',ArrowUp:'u',ArrowDown:'d',a:'l',d:'r',w:'u',s:'d'};if(m[e.key])move(m[e.key])};
add();add();draw();
</script></body></html>
