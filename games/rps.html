<!DOCTYPE html><html lang="ru"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>КНБ</title><style>body{margin:0;background:#0b1020;color:#eef;font-family:system-ui;padding:16px;text-align:center}
button{font-size:32px;margin:8px;padding:16px;border-radius:16px;border:0;background:#312e81;color:#fff}
a{color:#c4b5fd}</style></head><body>
<a href="/">← Hub</a><h2>✊ КНБ</h2><p id="r">Выбери</p>
<button onclick="play(0)">✊</button><button onclick="play(1)">✌️</button><button onclick="play(2)">✋</button>
<script>
function play(u){const c=Math.random()*3|0,names=['Камень','Ножницы','Бумага'];
  let t=u===c?'Ничья':((u+1)%3===c?'Ты выиграл':'Ты проиграл');
  document.getElementById('r').textContent=`Ты: ${names[u]} · ПК: ${names[c]} · ${t}`}
</script></body></html>
