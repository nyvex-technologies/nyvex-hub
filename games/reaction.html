<!DOCTYPE html><html lang="ru"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Реакция</title><style>body{margin:0;min-height:100vh;display:grid;place-items:center;background:#7f1d1d;color:#fff;font-family:system-ui;text-align:center}
#box{width:min(90vw,320px);height:200px;border-radius:20px;display:grid;place-items:center;font-size:20px;font-weight:800}
a{color:#c4b5fd;position:fixed;top:12px;left:12px}</style></head><body>
<a href="/">← Hub</a>
<div id="box">Нажми, чтобы начать</div>
<script>
let t0,wait,state='idle';
const box=document.getElementById('box');
box.onclick=()=>{
  if(state==='idle'||state==='result'){state='wait';box.style.background='#7f1d1d';box.textContent='Жди зелёный…';
    wait=setTimeout(()=>{state='go';t0=performance.now();box.style.background='#14532d';box.textContent='ЖМИ!'},1000+Math.random()*2000);return}
  if(state==='wait'){clearTimeout(wait);state='idle';box.textContent='Рано! Ещё раз';return}
  if(state==='go'){state='result';box.textContent=Math.round(performance.now()-t0)+' мс · ещё';box.style.background='#1e3a5f'}
};
</script></body></html>
